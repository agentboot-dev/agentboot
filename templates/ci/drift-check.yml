# AgentBoot Compliance Check — GitHub Actions workflow template
# Phase 11 C1.2: Runs drift-check on PRs that touch AI tool configuration files.
#
# Copy this file to .github/workflows/agentboot-compliance.yml in your repo.
# Requires: Node.js 22+, agentboot installed.

name: AgentBoot Compliance Check
on:
  pull_request:
    paths:
      - '.claude/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.windsurfrules'
      - '.gemini/**'
      - 'GEMINI.md'
      - '.junie/**'
      - '.aiassistant/**'
      - 'AGENTS.md'
      - '.mcp.json'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.agents/**'

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs — update the SHA and its version comment together.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Pinned agentboot version for reproducible, auditable CI. Keep in step with
      # the version your hub builds with; bump deliberately, like any dependency.
      # (npm accepts the v-prefixed form: agentboot@v0.15.0 ≡ agentboot@0.15.0)
      - run: npx agentboot@v0.15.0 drift-check --format json
