name: Validate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  validate:
    name: Validate and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows support is required for v1.0 (a key adopter is Windows-only), but the
    # Windows leg is non-blocking for now: it surfaces real Windows/git-bash issues
    # without gating the pipeline while that support is hardened. Promote to required
    # once it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # AgentBoot targets git-bash on Windows (bash is available on the runner),
        # so run every step in bash for parity with Linux/macOS.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Configure git identity (required by tests)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@agentboot.dev"

      - name: Typecheck
        run: npm run typecheck

      - name: Validate personas and traits
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check PERSONAS.md is up to date
        run: |
          if ! git diff --exit-code PERSONAS.md; then
            echo ""
            echo "PERSONAS.md is out of date."
            echo "Run 'npm run build' locally and commit the updated PERSONAS.md."
            exit 1
          fi
