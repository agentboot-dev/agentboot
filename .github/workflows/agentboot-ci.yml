# Reusable CI workflow for AgentBoot personas repos.
#
# Usage in your personas repo:
#
#   name: AgentBoot CI
#   on: [push, pull_request]
#   jobs:
#     agentboot:
#       # Pin to a release tag or a commit SHA. `@main` is a mutable ref: it
#       # re-points under you, which is the supply-chain shape this workflow's own
#       # `uses:` lines are SHA-pinned to avoid.
#       uses: agentboot-dev/agentboot/.github/workflows/agentboot-ci.yml@v0.20.2
#       with:
#         snapshot: true
#         # Runners to validate on. Defaults to Linux only; pass a JSON array to
#         # add legs. A team on Windows workstations should validate on Windows:
#         #   os: '["ubuntu-latest", "windows-latest"]'
#
# AB-125: CI Integration

name: AgentBoot CI (reusable)

on:
  workflow_call:
    inputs:
      # L39: this workflow is what AgentBoot SHIPS to adopters, and it hardcoded
      # `runs-on: ubuntu-latest` with no way to ask for anything else — so an
      # adopter whose developers are on Windows could not get a Windows leg out
      # of AgentBoot's own CI, and would validate governance artifacts on a
      # platform nobody there runs. `workflow_call` inputs cannot be arrays, so
      # this is a JSON array string expanded through fromJSON into the matrix.
      os:
        description: >-
          JSON array of runner labels to validate on, e.g.
          '["ubuntu-latest", "windows-latest"]'. Defaults to Linux only.
        required: false
        default: '["ubuntu-latest"]'
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        # AgentBoot requires Node >=22 (package.json engines). The reusable workflow
        # installs the package, so its default must satisfy the engine constraint.
        default: "22"
        type: string
      agentboot-version:
        description: "AgentBoot version to install (e.g., '0.6.0', 'latest'). Pin an exact version for reproducible, auditable CI."
        required: false
        default: "latest"
        type: string
      forbid-latest:
        description: "Policy switch: fail the workflow if agentboot-version resolves to 'latest'. Enable in production/regulated pipelines to force an explicit, pinned version."
        required: false
        default: false
        type: boolean
      config-path:
        description: "Path to agentboot.config.json"
        required: false
        default: "agentboot.config.json"
        type: string
      snapshot:
        description: "Run snapshot regression test"
        required: false
        default: false
        type: boolean
      behavioral:
        # DEPRECATED and inert as of v1.0 — see the "Behavioral Tests" step below.
        # The input is KEPT so that adopters already passing `behavioral: true`
        # keep a valid workflow call instead of a hard "unexpected input" error.
        # Removing it would break the callers this deprecation exists to protect.
        description: "DEPRECATED — no longer runs anything. Behavioral testing was withdrawn from the v1.0 surface."
        required: false
        default: false
        type: boolean
      strict:
        description: "Treat validation warnings as errors"
        required: false
        default: true
        type: boolean
    secrets:
      ANTHROPIC_API_KEY:
        description: "API key for behavioral tests (only needed if behavioral=true)"
        required: false

jobs:
  validate-and-build:
    name: Validate, Build & Test (${{ matrix.os }})
    strategy:
      # One platform failing must not cancel the others — the whole reason to
      # add a leg is to see how that platform behaves.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Several steps below use `$( )`, `||` and `2>/dev/null`. On a Windows
        # runner GitHub defaults `run:` to PowerShell, where those are syntax
        # errors — so adding a Windows leg without pinning the shell would fail
        # for reasons that have nothing to do with the repo under test. bash
        # ships on every GitHub-hosted runner, Windows included.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enforce pinned-version policy
        if: inputs.forbid-latest && inputs.agentboot-version == 'latest'
        run: |
          echo "::error::forbid-latest is enabled but agentboot-version is 'latest'. Pin an exact version (e.g. agentboot-version: '0.11.4')."
          exit 1

      - name: Install AgentBoot
        run: |
          npm install agentboot@${{ inputs.agentboot-version }}
          echo "Installed AgentBoot $(npx agentboot --version 2>/dev/null || echo 'unknown')"

      - name: Validate
        run: npx agentboot validate ${{ inputs.strict && '--strict' || '' }} -c ${{ inputs.config-path }}

      - name: Build
        run: npx agentboot build -c ${{ inputs.config-path }}

      - name: Snapshot Regression
        if: inputs.snapshot
        run: npx agentboot test --regression

      # J1: the runner used to parse 0 cases out of every scenario file and
      # return [] with no diagnostic, so this step passed by doing nothing. It
      # now exits non-zero when a file yields no runnable case, when no case
      # ran, or when expectations have no evaluator — the last is waivable with
      # --allow-unevaluated, which still prints the count.
      # D1 (ruled 2026-08-11): `--behavioral` is CUT from the v1.0 surface, and
      # `agentboot test --behavioral` now exits 1 with "unknown option".
      #
      # This is the PUBLISHED reusable workflow — adopters call it as
      # `uses: agentboot-dev/agentboot/.github/workflows/agentboot-ci.yml@<ref>`
      # — so removing the flag from the CLI without touching this file turned
      # every caller passing `behavioral: true` into a red build with an
      # unknown-option error. The breaking half of a ruling shipped while the
      # compensating half did not.
      #
      # So the step stays, stays green, and SAYS what happened. A caller who
      # asked for behavioral tests must not silently believe they ran.
      - name: Behavioral Tests (withdrawn in v1.0)
        if: inputs.behavioral
        run: |
          echo "::warning title=behavioral tests withdrawn::\
          The 'behavioral' input is deprecated and no longer runs anything. \
          Behavioral persona testing was withdrawn from the AgentBoot v1.0 \
          surface; 'agentboot test --behavioral' no longer exists. Remove the \
          'behavioral: true' input from your workflow call. Snapshot and \
          regression testing are unaffected."
