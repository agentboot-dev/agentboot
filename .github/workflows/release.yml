name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — validate without publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# Stacked merges queue behind each other instead of racing. Never cancel a
# release that has already started.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run when a PR is actually merged (not just closed), or on manual dispatch.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.merged == true)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the exact commit that triggered this run (the PR's merge
          # commit), so a queued release never silently publishes a later
          # state of main. fetch-depth: 0 is required to see tags.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      # Release contract: a release happens ONLY when package.json's version
      # differs from the latest v* tag — i.e. the merged PR deliberately bumped
      # it. Merges that don't bump the version (dependency updates, docs,
      # refactors) are absorbed silently until the next deliberate release PR.
      # No version-bump commit is ever pushed back to main by this workflow.
      - name: Determine release version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST_TAG_VERSION="${LATEST_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          # The highest of the two under semver ordering. A release fires ONLY
          # when package.json is strictly GREATER than the latest tag — never on
          # equal (no bump) and never on a DOWNGRADE (a bad merge setting
          # package.json below the latest tag must not cut a bogus lower release).
          HIGHEST=$(printf '%s\n%s\n' "$LATEST_TAG_VERSION" "$PKG_VERSION" | sort -V | tail -1)

          if [ -z "$LATEST_TAG_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "No existing tags. Will release v${PKG_VERSION}"
          elif [ "$PKG_VERSION" = "$LATEST_TAG_VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "package.json (${PKG_VERSION}) matches latest tag v${LATEST_TAG_VERSION} — nothing to release."
            echo "no version bump in this merge — no release" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HIGHEST" = "$PKG_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Version bump detected: ${LATEST_TAG_VERSION} → ${PKG_VERSION}"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::error::package.json (${PKG_VERSION}) is LOWER than the latest tag v${LATEST_TAG_VERSION} — refusing to cut a downgrade release. Bump package.json above the latest tag."
            echo "package.json below latest tag — refusing downgrade release" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check tag does not already exist
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists but package.json was bumped to ${VERSION}. Bump package.json to an unused version."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci

      # Required by the test suite (pipeline tests create commits in temp
      # repos), not for any bot commit — the workflow itself never commits.
      - name: Configure git identity (required by tests)
        if: steps.version.outputs.release == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@agentboot.dev"

      - name: Build and test
        if: steps.version.outputs.release == 'true'
        run: npm run validate && npm run build && npm test

      # Hard gate: the public site/docs hardcode the release version in a few
      # prose spots (scripts/version-strings.manifest.json). Fail the release —
      # before any tag is cut — if they were not bumped to this version, so the
      # site can never advertise a version that isn't shipping.
      - name: Verify release version strings
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx tsx scripts/check-version-strings.ts --version "$VERSION"

      - name: Tag the release commit
        if: steps.version.outputs.release == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        id: drafter
        if: steps.version.outputs.release == 'true' && !inputs.dry-run
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          tag: "v${{ steps.version.outputs.version }}"
          version: "${{ steps.version.outputs.version }}"
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.version.outputs.release == 'true' && !inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance

      # B13: attach an SBOM + checksums to the GitHub Release so enterprise
      # consumers get a verifiable route from an approved release to artifacts.
      # Verification procedure: SECURITY.md "Verifying a release".
      #
      # NOTE: the SBOM is deliberately NOT generated with `npm sbom --omit=dev`.
      # npm's omit filter drops any package that has *any* inbound edge from a
      # dev-only package — here a dev-only bundler declares peerDependencies on
      # tsx and esbuild, which silently knocked the entire runtime-critical
      # tsx → esbuild subtree (~31 packages) out of the published SBOM. Instead,
      # strip devDependencies in a scratch dir, re-resolve a prod-only lockfile,
      # and SBOM that tree — no omit flag needed, and a completeness guard
      # fails the release if the SBOM does not cover the full prod closure.
      - name: Attach SBOM and checksums to the release
        if: steps.version.outputs.release == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SBOM_DIR="$(mktemp -d)"
          cp package.json package-lock.json "$SBOM_DIR/"
          node -e '
            const fs = require("fs")
            const f = process.argv[1] + "/package.json"
            const p = JSON.parse(fs.readFileSync(f, "utf8"))
            delete p.devDependencies
            fs.writeFileSync(f, JSON.stringify(p, null, 2))
          ' "$SBOM_DIR"
          (cd "$SBOM_DIR" && npm install --package-lock-only --ignore-scripts)
          (cd "$SBOM_DIR" && npm sbom --sbom-format cyclonedx --package-lock-only) > "agentboot-${VERSION}.sbom.cdx.json"

          # Completeness guard: every package in the prod-only lockfile must
          # appear in the SBOM (name@version), and the runtime toolchain must
          # be present. Fails the release on any gap.
          node -e '
            const fs = require("fs")
            const [lockPath, sbomPath] = process.argv.slice(1)
            const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"))
            const sbom = JSON.parse(fs.readFileSync(sbomPath, "utf8"))
            const have = new Set((sbom.components || []).map(c => `${c.name}@${c.version}`))
            const want = Object.entries(lock.packages)
              .filter(([p]) => p !== "")
              .map(([p, e]) => `${p.replace(/^.*node_modules\//, "")}@${e.version}`)
            const missing = want.filter(w => !have.has(w))
            if (missing.length) {
              console.error(`SBOM incomplete: ${missing.length} of ${want.length} production packages missing:`)
              missing.forEach(m => console.error(`  - ${m}`))
              process.exit(1)
            }
            for (const name of ["tsx", "esbuild"]) {
              if (!want.some(w => w.startsWith(name + "@"))) {
                console.error(`Runtime-critical package absent from prod closure: ${name}`)
                process.exit(1)
              }
            }
            console.log(`SBOM complete: ${have.size} components cover all ${want.length} production packages`)
          ' "$SBOM_DIR/package-lock.json" "agentboot-${VERSION}.sbom.cdx.json"

          npm pack
          shasum -a 256 "agentboot-${VERSION}.tgz" "agentboot-${VERSION}.sbom.cdx.json" > "agentboot-${VERSION}.sha256"
          cat "agentboot-${VERSION}.sha256"
          gh release upload "v${VERSION}" \
            "agentboot-${VERSION}.sbom.cdx.json" \
            "agentboot-${VERSION}.sha256" \
            --clobber

      - name: Update Homebrew formula
        if: steps.version.outputs.release == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL_URL="https://registry.npmjs.org/agentboot/-/agentboot-${VERSION}.tgz"

          echo "Waiting for npm to propagate..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARBALL_URL")
            if [ "$HTTP_CODE" = "200" ]; then break; fi
            echo "  Attempt $i: HTTP $HTTP_CODE — retrying in 10s..."
            sleep 10
          done

          SHA=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)
          if [ -z "$SHA" ] || [ "$SHA" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
            echo "::error::Failed to fetch tarball SHA for v${VERSION}"
            exit 1
          fi
          echo "SHA256: $SHA"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/agentboot-dev/homebrew-agentboot.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i "s|url \"https://registry.npmjs.org/agentboot/-/agentboot-.*\.tgz\"|url \"${TARBALL_URL}\"|" Formula/agentboot.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/agentboot.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentboot.rb
          git commit -m "chore: update agentboot to v${VERSION}"
          git push

      - name: Summary
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "### Dry Run Complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Would have released **v${VERSION}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "- [GitHub Release](${{ steps.drafter.outputs.html_url }})" >> "$GITHUB_STEP_SUMMARY"
            echo "- [npm](https://www.npmjs.com/package/agentboot/v/${VERSION})" >> "$GITHUB_STEP_SUMMARY"
            echo "- Homebrew formula updated" >> "$GITHUB_STEP_SUMMARY"
          fi
