# Keep npm dependencies and pinned GitHub Actions current.
# Actions are pinned to commit SHAs in the workflows; Dependabot proposes SHA bumps
# with the corresponding version comment, so pinning stays maintainable.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
